name: Weekly Jodal Data Pipeline

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필수 라이브러리 설치
        run: |
          pip install requests pandas

      - name: 조달청 데이터 수집·정제 및 에어테이블 동기화 실행
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
        run: python collect.py

      - name: 정제된 마스터 CSV 파일 깃허브에 자동 저장
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add clean_contracts.csv
          git diff --staged --quiet || git commit -m "Auto-update cleaned contracts CSV"
          git push
