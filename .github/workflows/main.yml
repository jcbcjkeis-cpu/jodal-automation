name: Weekly Jodal Data Pipeline

on:
  schedule:
    # 매주 월요일 아침 9시(한국 시각 KST) 자동 가동 설정
    # UTC 기준으로는 월요일 00시 00분입니다.
    - cron: '0 0 * * 1'
  workflow_dispatch: # 필요할 때 수동으로 바로 실행할 수 있는 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 세팅
        uses: actions/setup-python@v5
        with:
          python-node-version: '3.12'

      - name: 필수 라이브러리 설치
        run: |
          pip install requests pandas

      - name: 조달청 수집 및 에어테이블 이식 코드 실행
        run: python collect.py
